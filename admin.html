<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Once P2P Admin</title><style>body{font-family:Arial;background:#f5f7fb;margin:0;color:#172033}main{max-width:1100px;margin:25px auto;padding:0 18px}.card{background:#fff;padding:18px;border-radius:14px;margin:15px 0;box-shadow:0 2px 12px #0001}input,button,select{padding:10px;margin:4px;border:1px solid #ccd3df;border-radius:8px}button{background:#111827;color:#fff;cursor:pointer}.ok{background:#087443}.danger{background:#b42318}</style></head><body><main><h1>Once P2P Admin</h1><div class="card"><input id="key" placeholder="Admin key"><button onclick="loadAll()">Open Admin</button><p>Keep the admin key server-side in production; this panel is for development.</p></div><div id="app"></div><script>let K='';async function api(u,o={}){o.headers={...(o.headers||{}),'x-admin-key':K};const r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||'Failed');return d}async function loadAll(){K=document.querySelector('#key').value;try{const [k,w,o]=await Promise.all([api('/api/admin/kyc'),api('/api/admin/wallet-requests'),api('/api/admin/orders')]);document.querySelector('#app').innerHTML='<div class="card"><h2>KYC</h2>'+k.map(x=>'<div><b>'+x.userId+'</b> — '+x.status+' — '+x.id+' <button onclick="reviewK(\''+x.id+'\',\'approved\')">Approve</button><button class="danger" onclick="reviewK(\''+x.id+'\',\'rejected\')">Reject</button></div>').join('')+'</div><div class="card"><h2>Wallet requests</h2>'+w.map(x=>'<div>'+x.userId+' — '+x.type+' — '+x.amount+' — '+x.status+' '+(x.status==='pending'?'<button onclick="reviewW(\''+x.id+'\',\'completed\')">Approve</button><button class="danger" onclick="reviewW(\''+x.id+'\',\'rejected\')">Reject</button>':'')+'</div>').join('')+'</div><div class="card"><h2>Orders & disputes</h2>'+o.map(x=>'<div>'+x.id+' — '+x.title+' — '+x.status+(x.status==='disputed'?' <button onclick="resolve(\''+x.id+'\',\'refund_buyer\')">Refund buyer</button><button class="ok" onclick="resolve(\''+x.id+'\',\'release_seller\')">Release seller</button>':'')+'</div>').join('')+'</div>'}catch(e){alert(e.message)}}async function reviewK(id,status){let reason=status==='rejected'?prompt('Rejection reason')||'':'';await api('/api/admin/kyc/'+id+'/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,reason})});loadAll()}async function reviewW(id,status){await api('/api/admin/wallet-requests/'+id+'/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});loadAll()}async function resolve(id,decision){const reason=prompt('Resolution note')||'';await api('/api/admin/orders/'+id+'/resolve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision,reason})});loadAll()}</script></main></body></html>
