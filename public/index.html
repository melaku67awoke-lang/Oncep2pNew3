<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Once P2P</title><style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#172033}header{padding:18px 5%;background:#111827;color:#fff;display:flex;justify-content:space-between}main{max-width:1100px;margin:25px auto;padding:0 18px}.card{background:#fff;border-radius:14px;padding:20px;margin:15px 0;box-shadow:0 2px 12px #0001}input,textarea,select,button{padding:11px;margin:5px 0;border:1px solid #d5dae3;border-radius:8px;box-sizing:border-box}input,textarea,select{width:100%}button{cursor:pointer;background:#111827;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}.muted{color:#687386}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:#eef2ff}.hidden{display:none}.danger{background:#b42318}.ok{background:#087443}.msg{padding:8px;border-radius:8px;background:#f1f5f9;margin:6px 0}.small{font-size:12px}</style></head><body><header><b>Once P2P</b><span id="status"></span></header><main id="app"></main><script>
let token=localStorage.getItem('once_token')||'';let uid='';const app=document.querySelector('#app');function H(){return token?{'Authorization':'Bearer '+token}:{} }async function api(url,opt={}){opt.headers={...(opt.headers||{}),...H()};const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}function money(n){return Number(n||0).toFixed(2)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function auth(){app.innerHTML='<div class="grid"><div class="card"><h2>Create account</h2><form id="reg"><input name="fullName" placeholder="Full name" required><input name="username" placeholder="Username" required><input name="password" type="password" minlength="8" placeholder="Password (8+ characters)" required><button>Register</button></form></div><div class="card"><h2>Log in</h2><form id="login"><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><button>Log in</button></form></div></div>';reg.onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});token=d.token;localStorage.setItem('once_token',token);load()}catch(x){alert(x.message)}};login.onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});token=d.token;localStorage.setItem('once_token',token);load()}catch(x){alert(x.message)}}}
async function load(){if(!token)return auth();try{const m=await api('/api/me');uid=m.user.userId;document.querySelector('#status').innerHTML=esc(m.user.username)+' · <button onclick="logout()">Log out</button>';if(m.kyc.status!=='approved')return kyc(m.kyc);dashboard(m)}catch(e){localStorage.removeItem('once_token');token='';auth()}}
function kyc(k){if(k.status==='pending'){app.innerHTML='<div class="card"><h2>KYC under review</h2><p>Your identity submission is being reviewed. Wallet and Marketplace stay locked until approval.</p><p class="pill">Pending</p><button onclick="load()">Check review status</button></div>';return}if(k.status==='rejected'){app.innerHTML='<div class="card"><h2>KYC rejected</h2><p>'+esc(k.reason||'Please correct your information and resubmit.')+'</p><button onclick="kycForm()">Resubmit KYC</button></div>';return}kycForm()}
function kycForm(){app.innerHTML='<div class="card"><h2>Verify your identity</h2><p class="muted">Submit your details and identity documents to unlock Once P2P.</p><form id="kf"><input name="fullName" placeholder="Full name" required><input name="dob" type="date" required><textarea name="address" placeholder="Address" required></textarea><select name="idType"><option>National ID</option><option>Passport</option><option>Driver License</option></select><input name="idNumber" placeholder="ID number" required><label>ID document <input name="idDocument" type="file" accept="image/*,.pdf" required></label><label>Selfie <input name="selfie" type="file" accept="image/*" required></label><button>Submit for review</button></form></div>';kf.onsubmit=async e=>{e.preventDefault();try{await api('/api/kyc',{method:'POST',body:new FormData(e.target)});load()}catch(x){alert(x.message)}}}
function dashboard(m){app.innerHTML='<div class="grid"><div class="card"><h2>Wallet</h2><h1>'+money(m.wallet.balance)+' ETB</h1><p>Held in escrow: '+money(m.wallet.heldBalance)+' ETB</p><button onclick="wallet()">Wallet</button></div><div class="card"><h2>Marketplace</h2><p>Buy and sell with protected escrow.</p><button onclick="market()">Open Marketplace</button></div><div class="card"><h2>My trades</h2><button onclick="orders()">View Orders</button></div><div class="card"><h2>Notifications</h2><button onclick="notices()">View Notifications</button></div></div><div id="content"></div>'}
async function wallet(){const w=await api('/api/wallet');document.querySelector('#content').innerHTML='<div class="card"><h2>Wallet</h2><p>Available: <b>'+money(w.balance)+' ETB</b></p><p>Escrow: <b>'+money(w.heldBalance)+' ETB</b></p><button onclick="deposit()">Request Deposit</button> <button onclick="withdraw()">Request Withdrawal</button> <button onclick="transfer()">Send</button><div id="tx"></div></div>';const ts=await api('/api/wallet/transactions');document.querySelector('#tx').innerHTML='<h3>Transactions</h3>'+ts.map(t=>'<p>'+esc(t.type)+' — '+money(t.amount)+' ETB — '+esc(t.status)+'</p>').join('')}
function deposit(){const n=prompt('Deposit amount (ETB)');if(n)api('/api/wallet/deposit-request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:n,method:'manual'})}).then(wallet).catch(e=>alert(e.message))}function withdraw(){const n=prompt('Withdrawal amount (ETB)');if(n)api('/api/wallet/withdraw-request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:n,method:'bank'})}).then(wallet).catch(e=>alert(e.message))}function transfer(){const to=prompt('Recipient username is not supported yet; enter user ID'),n=prompt('Amount ETB');if(to&&n)api('/api/wallet/transfer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({toUserId:to,amount:n})}).then(wallet).catch(e=>alert(e.message))}
async function market(){const ls=await api('/api/listings');document.querySelector('#content').innerHTML='<div class="card"><h2>Marketplace</h2><button onclick="newListing()">Create Listing</button><div class="grid">'+ls.map(l=>'<div class="card"><h3>'+esc(l.title)+'</h3><p>'+esc(l.description)+'</p><b>'+money(l.price)+' ETB</b><p class="muted">'+esc(l.category)+'</p><button onclick="buy(\''+l.id+'\')">Buy with escrow</button></div>').join('')+'</div></div>'}function newListing(){document.querySelector('#content').innerHTML='<div class="card"><h2>Create listing</h2><form id="lf"><input name="title" placeholder="Title" required><textarea name="description" placeholder="Description" required></textarea><input name="price" type="number" step="0.01" min="0.01" placeholder="Price ETB" required><select name="category"><option>Goods</option><option>Services</option><option>Other</option></select><button>Publish</button></form></div>';lf.onsubmit=async e=>{e.preventDefault();try{await api('/api/listings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});market()}catch(x){alert(x.message)}}}async function buy(id){if(!confirm('Pay this listing into escrow?'))return;try{await api('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({listingId:id})});orders()}catch(e){alert(e.message)}}
async function orders(){const os=await api('/api/orders');document.querySelector('#content').innerHTML='<div class="card"><h2>My Orders</h2>'+os.map(o=>'<div class="card"><h3>'+esc(o.title)+'</h3><p>'+money(o.amount)+' ETB · <b>'+esc(o.status)+'</b></p><button onclick="trade(\''+o.id+'\')">Open Trade</button></div>').join('')+'</div>'}
async function trade(id){const os=await api('/api/orders');const o=os.find(x=>x.id===id);if(!o)return;let actions='';if(o.sellerId===uid&&o.status==='paid_escrow')actions+='<button onclick="shipTrade(\''+id+'\')">Mark Shipped</button>';if(o.sellerId===uid&&o.status==='shipped')actions+='<button onclick="act(\''+id+'\',\'deliver\')">Mark Delivered</button>';if(o.buyerId===uid&&['shipped','delivered'].includes(o.status))actions+='<button class="ok" onclick="act(\''+id+'\',\'confirm\')">Confirm Received & Release</button>';if(['paid_escrow','shipped'].includes(o.status))actions+='<button class="danger" onclick="act(\''+id+'\',\'cancel\')">Cancel / Refund</button>';if(!['completed','cancelled','disputed','refunded'].includes(o.status))actions+='<button onclick="dispute(\''+id+'\')">Open Dispute</button>';document.querySelector('#content').innerHTML='<div class="card"><h2>Trade Details</h2><h3>'+esc(o.title)+'</h3><p>Amount: <b>'+money(o.amount)+' ETB</b></p><p>Status: <span class="pill">'+esc(o.status)+'</span></p><p>Ship by: '+(o.shipBy?esc(new Date(o.shipBy).toLocaleString()):'—')+' · Expires: '+(o.expiresAt?esc(new Date(o.expiresAt).toLocaleString()):'—')+'</p>'+(o.trackingNumber?'<p>Carrier: '+esc(o.carrier||'')+' · Tracking: '+esc(o.trackingNumber)+'</p>':'')'+actions+'<hr><h3>Trade chat</h3><div id="chat"></div><form id="mf"><input name="body" placeholder="Message buyer/seller" required><button>Send</button></form><h3>Evidence</h3><form id="ef" enctype="multipart/form-data"><input name="evidence" type="file" accept="image/*,.pdf" required><button>Upload evidence</button></form></div>';await chat(id);mf.onsubmit=async e=>{e.preventDefault();try{await api('/api/orders/'+id+'/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({body:new FormData(e.target).get('body')})});e.target.reset();chat(id)}catch(x){alert(x.message)}};ef.onsubmit=async e=>{e.preventDefault();try{await api('/api/orders/'+id+'/evidence',{method:'POST',body:new FormData(e.target)});alert('Evidence uploaded')}catch(x){alert(x.message)}}}
async function chat(id){const a=await api('/api/orders/'+id+'/messages');const c=document.querySelector('#chat');if(c)c.innerHTML=a.map(m=>'<div class="msg"><b>'+(m.fromUserId===uid?'You':'Other party')+'</b><br>'+esc(m.body)+'<div class="small">'+esc(m.createdAt)+'</div></div>').join('')||'<p class="muted">No messages yet.</p>'}async function shipTrade(id){const note=prompt('Shipping note (optional)')||'';const carrier=prompt('Carrier (optional)')||'';const trackingNumber=prompt('Tracking number (optional)')||'';try{await api('/api/orders/'+id+'/ship',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({note,carrier,trackingNumber})});trade(id)}catch(e){alert(e.message)}}async function act(id,a){try{await api('/api/orders/'+id+'/'+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})});trade(id)}catch(e){alert(e.message)}}async function dispute(id){const reason=prompt('Describe the problem');if(reason)try{await api('/api/orders/'+id+'/dispute',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reason})});trade(id)}catch(e){alert(e.message)}}async function notices(){const a=await api('/api/notifications');document.querySelector('#content').innerHTML='<div class="card"><h2>Notifications</h2>'+a.map(n=>'<p class="'+(n.read?'':'pill')+'">'+esc(n.title)+' — '+esc(n.body)+'</p>').join('')+'</div>'}async function logout(){await api('/api/auth/logout',{method:'POST'}).catch(()=>{});localStorage.removeItem('once_token');token='';load()}load();
</script></main></body></html>
